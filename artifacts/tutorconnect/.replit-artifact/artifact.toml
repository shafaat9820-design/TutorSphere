kind = "web"
previewPath = "/"
title = "TutorConnect"
version = "1.0.0"
id = "artifacts/tutorconnect"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 26066
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/tutorconnect run dev"

[services.env]
PORT = "26066"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/tutorconnect", "run", "build"]
publicDir = "artifacts/tutorconnect/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
